name: Update version.json

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate version.json
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/IMIS-Sync-Extension.zip"
          jq -n \
            --arg version "$VERSION" \
            --arg url "${{ github.event.release.html_url }}" \
            --arg zip_url "$ZIP_URL" \
            --arg changelog "$CHANGELOG" \
            '{version: $version, url: $url, zip_url: $zip_url, changelog: $changelog}' \
            > version.json
          echo "version.json updated:"
          cat version.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet || git commit -m "Update version.json to ${{ github.event.release.tag_name }} [skip ci]"
          git push
