<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IMIS Sync — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; color: #333; padding: 30px; }
    .container { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); overflow: hidden; }
    .head { background: #669933; color: #fff; padding: 16px 20px; font-size: 16px; font-weight: 700; }
    .body { padding: 24px 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 13px; font-family: "SF Mono", "Consolas", monospace;
    }
    input:focus { outline: none; border-color: #669933; box-shadow: 0 0 0 2px rgba(102,153,51,0.2); }
    .hint { font-size: 11px; color: #888; margin-top: 6px; line-height: 1.5; }
    .row { margin-bottom: 18px; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      padding: 10px 22px; border: 0; border-radius: 4px; font-size: 13px;
      font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .btn-save { background: #669933; color: #fff; }
    .btn-save:hover { background: #55862a; }
    .btn-test { background: #eee; color: #444; }
    .btn-test:hover { background: #ddd; }
    .status { margin-top: 14px; padding: 10px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; display: none; }
    .status-ok { background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; display: block; }
    .status-err { background: #fce4ec; border: 1px solid #ef9a9a; color: #b71c1c; display: block; }
    .repo { font-size: 12px; color: #888; margin-top: 20px; border-top: 1px solid #eee; padding-top: 14px; }
    .repo a { color: #669933; }
  </style>
</head>
<body>
  <div class="container">
    <div class="head">IMIS Sync — Settings</div>
    <div class="body">
      <div class="row">
        <label for="token">GitHub Personal Access Token</label>
        <input type="password" id="token" placeholder="github_pat_..." autocomplete="off">
        <div class="hint">
          Used to check for extension updates from your private GitHub repo.<br>
          Create one at <a href="https://github.com/settings/tokens?type=beta" target="_blank">github.com/settings/tokens</a>
          with <b>Contents: Read-only</b> permission on this repository.
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-save" id="save">Save</button>
        <button class="btn btn-test" id="test">Test Connection</button>
      </div>

      <div class="status" id="status"></div>

      <div class="repo">
        Repo: <a href="https://github.com/pcmhospital/bahmni_imis_chrome_extension" target="_blank">pcmhospital/bahmni_imis_chrome_extension</a>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
